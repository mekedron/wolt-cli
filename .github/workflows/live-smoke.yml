name: Live smoke (daily)

# Daily smoke against real Wolt consumer-api endpoints. Detects
# upstream contract drift before users do. The read-only surface
# (status/account/feed/venue/cart-show) always runs; a cart round-trip
# (add a live orderable item → CLI checkout preview → MCP checkout preview
# → remove) runs because WOLT_SMOKE_CART=1 is set below. A sell-by-weight leg
# follows it: weighted items are priced by the selected weight rather than per
# unit, so it asserts the basket line price, previews checkout, and confirms
# the line refuses partial removal.
# The MCP steps spawn wolt-mcp over stdio for read-only venue detail/hours and
# checkout preview, so the daily run guards the MCP surface as well as the CLI.
# Checkout is preview-only — no real order is ever placed, and only the unit
# added by this run is removed. No login or sync.
#
# Required repository secret:
#   WOLT_SMOKE_CONFIG_JSON  contents of ~/.wolt/.wolt-config.json
#
# Seed it in one shot from a logged-in machine:
#   wolt status >/dev/null  # ensures tokens are current on disk
#   gh secret set WOLT_SMOKE_CONFIG_JSON < ~/.wolt/.wolt-config.json
#
# Why the whole config (not just wtoken + wrefresh_token): Wolt binds
# the session to device-level cookies (telemetryDeviceId, activeLocation,
# lantern, etc.). A synthetic config with only __wtoken / __wrtoken
# returns 401 "session expired" even with valid tokens.
#
# Optional repository secret (reuses refreshed access tokens between runs):
#   WOLT_SMOKE_WRITE_PAT  fine-grained PAT, scope: Secrets=write +
#                         Metadata=read, on this repo only.
# When set, the workflow writes the post-run ~/.wolt/.wolt-config.json
# back to WOLT_SMOKE_CONFIG_JSON. Automatic refresh persists only the new
# access token; the bootstrap refresh token and cookies remain pinned.
# Use a dedicated CI-only Wolt account so external login/logout activity
# does not replace the credentials while the smoke is running.

on:
  schedule:
    - cron: "0 7 * * *" # Daily 07:00 UTC
  workflow_dispatch:

# Note: deliberately no pull_request / push trigger. The secrets must
# never be available to fork PRs.

permissions:
  contents: read
  issues: write # for the failure-tracker issue thread

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke live CLI and MCP endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Optional repository variables let forks run the same smoke in any
      # supported market. Empty values fall back to the script's CI fixture.
      WOLT_SMOKE_LAT: ${{ vars.WOLT_SMOKE_LAT }}
      WOLT_SMOKE_LON: ${{ vars.WOLT_SMOKE_LON }}
      WOLT_SMOKE_VENUE: ${{ vars.WOLT_SMOKE_VENUE }}
      WOLT_SMOKE_CART_VENUE: ${{ vars.WOLT_SMOKE_CART_VENUE }}
      # Grocery venue for the sell-by-weight leg. Empty falls back to the cart
      # venue and then to discovery; only grocery assortments carry them.
      WOLT_SMOKE_WEIGHTED_VENUE: ${{ vars.WOLT_SMOKE_WEIGHTED_VENUE }}
      # Enables the mutating cart round-trip (add → checkout preview →
      # remove) in live-smoke.sh. Unset locally so manual runs stay
      # read-only and never touch a real cart.
      WOLT_SMOKE_CART: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Build wolt
        run: |
          BUILD_VERSION="$(git describe --tags --always --dirty)"
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${BUILD_VERSION}" \
            -o bin/wolt ./cmd/wolt
          ./bin/wolt --version

      - name: Build wolt-mcp
        # Drives the MCP smokes — read-only venue tools and checkout preview.
        # The live-smoke script also builds this on demand, but doing it here
        # fails fast and keeps the build out of the timed smoke window.
        run: go build -trimpath -o bin/wolt-mcp ./cmd/wolt-mcp

      - name: Verify smoke secret is set
        env:
          WOLT_SMOKE_CONFIG_JSON: ${{ secrets.WOLT_SMOKE_CONFIG_JSON }}
        run: |
          if [ -z "${WOLT_SMOKE_CONFIG_JSON}" ]; then
            echo "::error::Required secret WOLT_SMOKE_CONFIG_JSON is missing. See workflow header for seeding instructions."
            exit 1
          fi
          # Sanity-check the secret is well-formed JSON without echoing
          # any of its contents. jq exits non-zero on parse error.
          printf '%s' "${WOLT_SMOKE_CONFIG_JSON}" | jq -e '.account.wtoken | type == "string" and length > 100' >/dev/null \
            || { echo "::error::WOLT_SMOKE_CONFIG_JSON is not valid JSON, or .account.wtoken is missing/short."; exit 1; }

      - name: Run live smoke
        id: smoke
        env:
          WOLT_SMOKE_CONFIG_JSON: ${{ secrets.WOLT_SMOKE_CONFIG_JSON }}
        # The script prints only its own status lines and a redacted
        # error tail on failure. Its log is safe to surface publicly;
        # the raw JSON outputs in /tmp/wolt-smoke are never uploaded.
        run: ./scripts/live-smoke.sh

      - name: Step summary
        if: always()
        # Surface only the authoritative suite outcome. Endpoint errors live
        # in stdout JSON, so stderr presence is not a reliable result signal.
        run: |
          {
            echo "## Live smoke results"
            echo ""
            echo "| Suite | Status |"
            echo "|---|---|"
            case "${{ steps.smoke.outcome }}" in
              success) status="✅" ;;
              failure) status="❌" ;;
              cancelled) status="⚪ cancelled" ;;
              *) status="⚪ ${{ steps.smoke.outcome }}" ;;
            esac
            printf "| Live smoke | %s |\n" "$status"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Persist refreshed access token back to secret
        if: always()
        env:
          # Separate PAT, not GITHUB_TOKEN — the default Actions token
          # cannot write repository secrets. Fine-grained PAT scoped to
          # this repo with Secrets=write + Metadata=read is sufficient.
          GH_TOKEN: ${{ secrets.WOLT_SMOKE_WRITE_PAT }}
        run: |
          # The CLI safely persists a refreshed access token while keeping
          # the saved bootstrap refresh token and cookies unchanged. Mirror
          # that config back into the secret so the next run can reuse the
          # newest access token.
          #
          # Runs on always() rather than success() because a partial smoke
          # failure (e.g., one endpoint contract drifted) doesn't undo the
          # auth refresh — we still want to preserve the refreshed access.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WOLT_SMOKE_WRITE_PAT not set; refreshed access-token write-back skipped."
            exit 0
          fi
          cfg="${HOME}/.wolt/.wolt-config.json"
          if [ ! -s "${cfg}" ]; then
            echo "::warning::No config on disk at ${cfg}; skipping write-back."
            exit 0
          fi
          # Don't poison the secret if the file got truncated, the access
          # token never materialised, or the smoke script's seed step
          # failed mid-write.
          if ! jq -e '.account.wtoken | type == "string" and length > 100' "${cfg}" >/dev/null 2>&1; then
            echo "::warning::Config at ${cfg} failed structural check; skipping write-back."
            exit 0
          fi
          if ! jq -e '.account.wrefresh_token | type == "string" and length > 10' "${cfg}" >/dev/null 2>&1; then
            echo "::warning::Config at ${cfg} has no usable refresh_token; skipping write-back."
            exit 0
          fi
          gh secret set WOLT_SMOKE_CONFIG_JSON --repo "${GITHUB_REPOSITORY}" <"${cfg}"
          echo "::notice::WOLT_SMOKE_CONFIG_JSON updated with the refreshed access token."

      - name: Wipe local smoke outputs
        if: always()
        # Belt-and-braces: prevent any later step (or future workflow
        # change) from accidentally uploading them as artifacts.
        run: rm -rf /tmp/wolt-smoke ~/.wolt

      - name: Open or update tracker issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # De-dupe by fixed title prefix. If an open issue with this
          # prefix exists, append a comment; otherwise file a new one.
          title_prefix="Live smoke failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          today="$(date -u +%Y-%m-%d)"
          body=$(
            cat <<EOF
          Daily live-Wolt smoke failed on **${today}**.

          - Run: ${run_url}
          - Likely causes (in rough order of frequency):
            1. \`WOLT_SMOKE_CONFIG_JSON\` is no longer accepted (the session was revoked Wolt-side, or an explicit login/logout replaced it). Re-seed from a logged-in machine — ideally a CI-dedicated Wolt account so other activity does not replace it:
               \`\`\`
               wolt status >/dev/null && gh secret set WOLT_SMOKE_CONFIG_JSON < ~/.wolt/.wolt-config.json
               \`\`\`
               \`WOLT_SMOKE_WRITE_PAT\` is optional; when configured it copies refreshed access tokens back to the secret between runs.
            2. Wolt changed an endpoint contract (the smoke is doing its job — fix the gateway parser).
            3. Transient Wolt 5xx / 429 burst → rerun via Actions → Live smoke (daily) → Run workflow.

          See the failed step in the run for the specific endpoint and the pre-flight HTTP trace.
          EOF
          )
          existing="$(gh issue list --state open --search "in:title \"${title_prefix}\"" --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create \
              --title "${title_prefix} — first observed ${today}" \
              --body "${body}"
          fi
